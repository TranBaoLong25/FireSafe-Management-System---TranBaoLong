        condition: service_healthy

  incident-gis-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pccc_incident_gis
    ports: ["5437:5432"]
    volumes:
      - incident-gis-data:/var/lib/postgresql/data
      - ./pccc-service-incident-gis/db/init:/docker-entrypoint-initdb.d:ro   # tự chạy *.sql theo thứ tự tên khi tạo DB lần đầu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pccc_incident_gis"]
      interval: 5s
      timeout: 5s
      retries: 10

  incident-gis:
    build: ./pccc-service-incident-gis
    environment:
      PORT: 3005
      SERVICE_NAME: pccc-service-incident-gis
      DATABASE_URL: postgres://postgres:postgres@incident-gis-db:5432/pccc_incident_gis
      JWT_SECRET: ${JWT_SECRET:-doi-thanh-chuoi-bi-mat-dai-it-nhat-32-ky-tu}
    ports: ["3005:3005"]
    depends_on:
      incident-gis-db:
        condition: service_healthy

volumes:
  auth-data:
  facility-data:
  equipment-data:
  inspection-data:
  incident-gis-data:
