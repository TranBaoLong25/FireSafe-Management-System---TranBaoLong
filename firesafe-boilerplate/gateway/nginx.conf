# ============================================================
# FireSafe API Gateway (nginx) – checklist #4
# Mọi request gọi http://localhost:8088/api/v1/... ; gateway chuyển tiếp
# nguyên đường dẫn tới service theo tài nguyên đứng sau /api/v1/.
# Token vẫn do từng service tự kiểm tra.
# Tuần 6 (T6-01) bổ sung: giới hạn số request, mã theo dõi request, Swagger.
# ============================================================
events {}

http {
  client_max_body_size 20m;   # đủ cho upload tài liệu, ảnh
  proxy_read_timeout 60s;

  # DNS nội bộ của Docker; service build lại (đổi IP) gateway vẫn gọi đúng
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    # UC01 – pccc-service-auth
    location ~ ^/api/v1/(auth|users|units|roles|permissions|audit-logs)(/|$) {
      set $svc auth:3001;
      proxy_pass http://$svc;
    }

    # UC02, UC03 – pccc-service-facility
    location ~ ^/api/v1/(facility-types|organizations|facilities|dossiers|document-types|documents|files)(/|$) {
      set $svc facility:3002;
      proxy_pass http://$svc;
    }

    # UC04 – pccc-service-equipment
    location ~ ^/api/v1/(equipment-types|equipment|safety-conditions|facility-safety-conditions|water-sources)(/|$) {
      set $svc equipment:3003;
      proxy_pass http://$svc;
    }

    # UC05, UC06 – pccc-service-inspection
    location ~ ^/api/v1/(templates|self-inspections|plans|official-inspections|inspection-reports)(/|$) {
      set $svc inspection:3004;
      proxy_pass http://$svc;
    }

    # UC07 – UC10 – pccc-service-incident-gis
    location ~ ^/api/v1/(findings|violations|penalties|remediations|incidents|gis|reports|notifications|alert-rules)(/|$) {
      set $svc incident-gis:3005;
      proxy_pass http://$svc;
    }

    # Đường dẫn không thuộc service nào
    location / {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Không có API này trên gateway"}}';
    }
  }
}
